[package]
name = "stoke_hook_launch_tax"
version = "0.1.0"
description = "Stoke coin hook: a higher fee at launch, on buys, sells or both, that falls to the coin's own fee."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stoke_hook_launch_tax"

[features]
# The program's own panic handler keeps formatting code out of the binary.
default = ["custom-panic"]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
meridian-core = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
