[workspace]
members = ["crates/*", "programs/*"]
# The Jupiter adapter is its own workspace: Jupiter's test kit pins an older LiteSVM than the tests here use.
exclude = ["jupiter"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"
uint = "0.10"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
meridian-core = { path = "crates/meridian-core" }

[profile.release]
# Optimize the on-chain programs for size: rent is paid per byte of program.
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
